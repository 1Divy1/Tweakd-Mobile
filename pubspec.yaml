name: tweakd
description: "Tweakd — the social network for car people."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  go_router: ^17.2.1
  dio: ^5.9.2
  # Direct only so the Supabase data layer can catch http's ClientException
  # (connectivity errors) and re-throw it as the app's NetworkException.
  http: ^1.6.0
  hive: ^2.2.3
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.12.4
  dartz: ^0.10.1
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.2.4
  flutter_image_compress: ^2.4.0
  image_picker: ^1.1.2
  uuid: ^4.0.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  flutter_facebook_auth: ^7.1.7
  permission_handler: ^12.0.3
  emoji_picker_flutter: ^4.4.0
  mapbox_maps_flutter: ^2.27.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2
  flutter_native_splash: ^2.4.7
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  app_links: ^7.0.0
  flutter_file_dialog: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  injectable_generator: ^3.0.2
  flutter_launcher_icons: ^0.14.4

# Source art below lives in design/, not assets/, because it is only read at
# build time by these generators — the shipped app uses the native icon and
# launch-screen files they produce, so bundling the sources too would just
# pad the download.
flutter_launcher_icons:
  android: true
  ios: true
  # Opaque (no alpha): iOS flattens transparency in app icons to black.
  image_path: "design/icon/tweakd_icon_light.png"
  min_sdk_android: 21

# Native (OS-level) launch screen shown the instant the app is tapped, before
# the Flutter engine has drawn a single frame. Colors/images mirror the
# Flutter-drawn SplashPage exactly so the handoff between the two is
# seamless. color_dark/image_dark follow the OS dark-mode setting — the app
# itself has no dark theme yet, so everywhere else in the UI still forces
# light regardless of this.
flutter_native_splash:
  color: "#ffffff"
  image: design/splash/tweakd_splash_light.png
  color_dark: "#000000"
  image_dark: design/splash/tweakd_splash_dark.png
  # Android 12+ masks the splash icon into a circle (diameter 2/3 of the
  # image), which would crop the ends off the wide wordmark. These variants
  # pre-scale it to ~65% width so it sits fully inside that safe zone.
  android_12:
    color: "#ffffff"
    image: design/splash/tweakd_splash_a12_light.png
    color_dark: "#000000"
    image_dark: design/splash/tweakd_splash_a12_dark.png
  web: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/logos/
    - assets/app_logo/