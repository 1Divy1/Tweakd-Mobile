name: car_social_media_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  go_router: ^17.2.1
  dio: ^5.9.2
  # Direct only so the Supabase data layer can catch http's ClientException
  # (connectivity errors) and re-throw it as the app's NetworkException.
  http: ^1.6.0
  hive: ^2.2.3
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.12.4
  dartz: ^0.10.1
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.2.4
  flutter_image_compress: ^2.4.0
  image_picker: ^1.1.2
  uuid: ^4.0.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  flutter_facebook_auth: ^7.1.7
  permission_handler: ^12.0.3
  emoji_picker_flutter: ^4.4.0
  mapbox_maps_flutter: ^2.27.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  injectable_generator: ^3.0.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/logos/