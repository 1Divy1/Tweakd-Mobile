<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Contests inside car events — Kinetic Edge</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #EDEFF3; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  a { color: #FF4D00; text-decoration: none; }
  a:hover { color: #E64500; }
  @keyframes ke-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .ke-blink { animation: ke-blink 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .ke-blink { animation: none; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="palette.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="event-data.jsx"></script>
<script type="text/babel" src="event-widget.jsx"></script>
<script type="text/babel" src="contest-data.jsx"></script>
<script type="text/babel" src="contest-ui.jsx"></script>
<script type="text/babel" src="contest-attendee.jsx"></script>
<script type="text/babel" src="contest-organizer.jsx"></script>
<script type="text/babel" src="contest-extras.jsx"></script>
<script type="text/babel" src="car-meet.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, IOSDevice } = window;

  const Phone = ({ children }) => <IOSDevice width={390} height={844}>{children}</IOSDevice>;

  function App() {
    const Meet = (p) => <Phone><window.CarMeetScreen onBack={() => window.location.assign("Car Meet Page.html")} {...p}/></Phone>;
    const Contest = (p) => <Phone><window.ContestScreen {...p}/></Phone>;

    return (
      <DesignCanvas
        title="Contests inside car events — Kinetic Edge"
        subtitle="Organizers open votes inside a meet · attendees vote once per contest and can change it · the board moves live"
      >
        <DCSection id="attendee" title="Attendee — voting">
          <DCArtboard id="tab" label="CONTESTS tab in the meet — live, scheduled, results" width={430} height={920}>
            {Meet({ eventId: "m1", initTab: "contests" })}
          </DCArtboard>
          <DCArtboard id="voted" label="Open contest — you've already voted, board ticks up live" width={430} height={920}>
            {Contest({ contestId: "k1" })}
          </DCArtboard>
          <DCArtboard id="novote" label="Open contest — no vote cast yet" width={430} height={920}>
            {Contest({ contestId: "k2" })}
          </DCArtboard>
          <DCArtboard id="picker" label="Vote picker — tap a car, one vote per contest" width={430} height={920}>
            {Contest({ contestId: "k2", autoVote: true })}
          </DCArtboard>
          <DCArtboard id="soon" label="Closing in minutes — 45m contest on the ramp" width={430} height={920}>
            {Contest({ contestId: "k3" })}
          </DCArtboard>
          <DCArtboard id="scheduled" label="Not open yet — entries visible, voting locked" width={430} height={920}>
            {Contest({ contestId: "k5" })}
          </DCArtboard>
          <DCArtboard id="enter" label="Owner opts their car into categories" width={430} height={920}>
            {Meet({ eventId: "m1", initTab: "contests", initEnter: true })}
          </DCArtboard>
          <DCArtboard id="overview" label="Overview tab — contests surface above attendees" width={430} height={920}>
            {Meet({ eventId: "m1", initTab: "overview" })}
          </DCArtboard>
        </DCSection>

        <DCSection id="results" title="Results & what a win leaves behind">
          <DCArtboard id="finished" label="Finished contest — winner, badge, final standings" width={430} height={920}>
            {Contest({ contestId: "k4" })}
          </DCArtboard>
          <DCArtboard id="share" label="Share sheet — the card the winner posts" width={430} height={920}>
            {Contest({ contestId: "k4", openShare: true })}
          </DCArtboard>
          <DCArtboard id="feed" label="Winner card posted in the feed" width={430} height={620}>
            <Phone><window.FeedWinPost/></Phone>
          </DCArtboard>
          <DCArtboard id="badges" label="Badges on the car profile + owner's profile" width={430} height={920}>
            <Phone><window.CarProfileBadges/></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="organizer" title="Organizer — running the contests">
          <DCArtboard id="dash" label="Contests dashboard for your own meet" width={430} height={920}>
            <Phone><window.OrganizerContestsScreen eventId="m1" onBack={() => {}} onCreate={() => {}}/></Phone>
          </DCArtboard>
          <DCArtboard id="finish" label="Finish early — confirm sheet shows who wins right now" width={430} height={920}>
            <Phone><window.OrganizerContestsScreen eventId="m1" autoFinish="k1" onBack={() => {}} onCreate={() => {}}/></Phone>
          </DCArtboard>
          <DCArtboard id="published" label="Finished & published — attendees notified" width={430} height={920}>
            <Phone><window.OrganizerContestsScreen eventId="m1" autoFinish="k1" published onBack={() => {}} onCreate={() => {}}/></Phone>
          </DCArtboard>
          <DCArtboard id="create" label="Create a contest — empty" width={430} height={920}>
            <Phone><window.CreateContestScreen eventId="m1" onBack={() => {}}/></Phone>
          </DCArtboard>
          <DCArtboard id="create2" label="Create a contest — filled in, ready to publish" width={430} height={920}>
            <Phone><window.CreateContestScreen eventId="m1" step={2} onBack={() => {}}/></Phone>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
