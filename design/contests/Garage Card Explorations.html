<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Garage card — directions</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #EDEFF3; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  a { color: #0A0A0A; } a:hover { color: #FF4D00; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="palette.js"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="garage-card-variants.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, GarageVariants: G } = window;
  const OPTS = [
    ["a","A · Poster — photo leads, name on the metal", G.A, 900],
    ["b","B · Rail — compact, more cars per screen", G.B, 560],
    ["c","C · Spec plate — photo over a data plate", G.C, 1180],
    ["d","D · Gallery — no card chrome, photo-first", G.D, 1160],
  ];
  function App() {
    return (
      <DesignCanvas title="Garage card — four directions" subtitle="Whole-car photography · drop your own shots into the empty slots">
        <DCSection id="dirs" title="Garage tab · card directions">
          {OPTS.map(([k,label,C,ht])=>(
            <DCArtboard key={k} id={k} label={label} width={390} height={ht}>
              <C/>
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
