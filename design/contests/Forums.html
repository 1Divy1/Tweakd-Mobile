<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Forums — Kinetic Edge</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #EDEFF3; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="palette.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="forums-data.jsx"></script>
<script type="text/babel" src="forums-ui.jsx"></script>
<script type="text/babel" src="forums-screens.jsx"></script>
<script type="text/babel" src="forums-screens-2.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, IOSDevice } = window;
  const { useTweaks, TweaksPanel, TweakSection, TweakSlider, TweakColor } = window;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "#FF4D00",
    "cardRadius": 18,
    "tabIcon": 26
  }/*EDITMODE-END*/;

  function Frame({ children }) {
    return <IOSDevice width={390} height={844}>{children}</IOSDevice>;
  }

  function AB({ id, label, children }) {
    // NOTE: rendered via a normal function (not JSX element) so the returned
    // node's .type is DCArtboard — DCSection only walks direct DCArtboard kids.
    return (
      <DCArtboard id={id} label={label} width={430} height={920}>
        <Frame>{children}</Frame>
      </DCArtboard>
    );
  }

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    window.KE.accent = t.accent;
    window.FR_CFG = { radius: t.cardRadius, tabIcon: t.tabIcon };
    return (
      <React.Fragment>
      <DesignCanvas
        title="Forums — Kinetic Edge"
        subtitle="One shared pool of threads · browsed by car or by topic · saved filters as shortcuts"
      >
        <DCSection id="landing" title="Forums landing" subtitle="Personalized home — pinned shortcuts + hot threads. Strong day-one empty state.">
          {AB({ id: "landing-full",  label: "Populated",      children: <window.LandingScreen/> })}
          {AB({ id: "landing-empty", label: "Empty · day one", children: <window.LandingEmptyScreen/> })}
        </DCSection>

        <DCSection id="browse" title="Browse — the two lenses" subtitle="Segmented By car / By topic. Both converge on the same threads.">
          {AB({ id: "browse-car",   label: "By car — brand grid",           children: <window.BrowseCarScreen/> })}
          {AB({ id: "browse-topic", label: "By topic — component + format", children: <window.BrowseTopicScreen/> })}
        </DCSection>

        <DCSection id="hubs" title="Hubs" subtitle="Brand → Model is the identity axis. Topic is the cross-brand axis. Refine chips work identically on both.">
          {AB({ id: "brand-hub", label: "Brand hub · BMW",              children: <window.BrandHubScreen/> })}
          {AB({ id: "model-hub", label: "Model hub · M4 (primary)",     children: <window.ModelHubScreen/> })}
          {AB({ id: "model-load", label: "Model hub · loading",         children: <window.ModelHubScreen loading/> })}
          {AB({ id: "topic-hub", label: "Topic hub · Tuning (inverted)", children: <window.TopicHubScreen/> })}
        </DCSection>

        <DCSection id="detail" title="Thread detail" subtitle="Full body + tag chips, like/reply/save/share, Reddit-style nested replies with collapse and [deleted] state.">
          {AB({ id: "detail-open",   label: "Open thread",   children: <window.ThreadDetailScreen/> })}
          {AB({ id: "detail-locked", label: "Locked thread", children: <window.ThreadDetailScreen locked/> })}
        </DCSection>

        <DCSection id="create" title="Create thread" subtitle="Low-friction posting: model autocomplete (brand auto-derived), garage pre-fill, grouped topic multi-select.">
          {AB({ id: "create", label: "Compose", children: <window.CreateThreadScreen/> })}
        </DCSection>

        <DCSection id="states" title="Sheets & interactions" subtitle="Save-shortcut sheet and the long-press → save-as-shortcut affordance.">
          {AB({ id: "save-sheet", label: "Save-shortcut sheet", children: <window.SaveShortcutScreen/> })}
          {AB({ id: "long-press", label: "Long-press a chip",   children: <window.LongPressScreen/> })}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Cards"/>
        <TweakSlider label="Card corners" value={t.cardRadius} min={4} max={28} step={1} unit="px"
                     onChange={(v) => setTweak('cardRadius', v)}/>
        <TweakColor label="Accent" value={t.accent}
                    options={['#FF4D00', '#2A6FDB', '#1F8A5B', '#E0245E', '#7A5AE0']}
                    onChange={(v) => setTweak('accent', v)}/>
        <TweakSection label="Bottom nav"/>
        <TweakSlider label="Tab icon size" value={t.tabIcon} min={16} max={26} step={1} unit="px"
                     onChange={(v) => setTweak('tabIcon', v)}/>
      </TweaksPanel>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
