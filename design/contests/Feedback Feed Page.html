<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Feedback Feed — Tweakd</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="palette.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="add-flow.jsx"></script>
<script type="text/babel" src="feedback-feed.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const { IOSDevice } = window;
  const { FeedbackFeedScreen, FeedbackComposeScreen, FeedbackFeedFlow, CompletedScreen } = window;

  function Frame({ children }) {
    return <IOSDevice width={390} height={844}>{children}</IOSDevice>;
  }

  function App() {
    return (
      <DesignCanvas
        title="Feedback Feed — Tweakd"
        subtitle="New nav destination · public feed, up/down votes, sort by newest / popular / oldest · own posts can be deleted"
      >
        <DCSection id="flow" title="Interactive — sort tabs, vote, tap NEW to post feedback">
          <DCArtboard id="live" label="Full flow · fully interactive" width={430} height={910}>
            <Frame><FeedbackFeedFlow/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="feed-states" title="Feed — sort states & empty state">
          <DCArtboard id="popular" label="Sorted by Popular (default)" width={430} height={910}>
            <Frame><StandaloneFeed sort="popular"/></Frame>
          </DCArtboard>
          <DCArtboard id="newest" label="Sorted by Newest" width={430} height={910}>
            <Frame><StandaloneFeed sort="newest"/></Frame>
          </DCArtboard>
          <DCArtboard id="oldest" label="Sorted by Oldest" width={430} height={910}>
            <Frame><StandaloneFeed sort="oldest"/></Frame>
          </DCArtboard>
          <DCArtboard id="empty" label="Empty state" width={430} height={910}>
            <Frame><EmptyFeed/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="completed" title="Completed requests — dedicated section, linked from the feed (not a 4th sort tab)">
          <DCArtboard id="completed-list" label="Completed screen" width={430} height={910}>
            <Frame><CompletedScreen/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="compose-states" title="Compose — key states">
          <DCArtboard id="c-empty" label="Empty · submit disabled" width={430} height={910}>
            <Frame><FeedbackComposeScreen/></Frame>
          </DCArtboard>
          <DCArtboard id="c-picked" label="Category picked, message empty" width={430} height={910}>
            <Frame><FeedbackComposeScreen initialCategory="bug"/></Frame>
          </DCArtboard>
          <DCArtboard id="c-filled" label="Filled · ready to post" width={430} height={910}>
            <Frame><FeedbackComposeScreen initialCategory="feature_request" initialMessage={"Would love a dark mode toggle in settings \u2014 long night garage sessions need it."}/></Frame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  function StandaloneFeed({ sort }) {
    const { useState } = React;
    const [posts, setPosts] = useState(() => window.SEED_POSTS_COPY());
    return <FeedbackFeedScreen posts={posts} setPosts={setPosts} sort={sort}/>;
  }
  function EmptyFeed() {
    const { useState } = React;
    const [posts, setPosts] = useState([]);
    return <FeedbackFeedScreen posts={posts} setPosts={setPosts}/>;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
