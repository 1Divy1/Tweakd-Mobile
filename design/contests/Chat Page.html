<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Chat — Kinetic Edge</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #EDEFF3; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  a { color: #FF4D00; }
  a:hover { color: #E64500; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="palette.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="chat.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const { IOSDevice } = window;
  const { ChatScreen } = window;

  function Frame({ state }) {
    return (
      <IOSDevice width={390} height={844}>
        <ChatScreen state={state}/>
      </IOSDevice>
    );
  }

  function App() {
    const states = [
      { id: "default", label: "Conversation" },
      { id: "typing",  label: "They're typing" },
    ];
    return (
      <DesignCanvas
        title="Chat — Kinetic Edge"
        subtitle="Thread view · dark outgoing bubbles · shared post · typing indicator · seen receipt"
      >
        <DCSection id="chat" title="Chat Thread" subtitle="Tap back to return to the inbox">
          {states.map(s => (
            <DCArtboard key={s.id} id={`chat-${s.id}`} label={s.label} width={430} height={920}>
              <Frame state={s.id}/>
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
