<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Feed — Kinetic Edge</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #EDEFF3; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="palette.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="feed.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const { IOSDevice } = window;
  const { FeedScreen } = window;
  const { useTweaks, TweaksPanel, TweakSection, TweakSlider, TweakRadio } = window;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "imageHeight": 240,
    "cardRadius": 20,
    "peek": 22,
    "imageFit": "cover"
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const cfg = {
      imageHeight: t.imageHeight,
      cardRadius: t.cardRadius,
      peek: t.peek,
      imageFit: t.imageFit,
    };
    return (
      <React.Fragment>
        <DesignCanvas
          title="Feed — Kinetic Edge"
          subtitle="Vertical post feed · peek carousel · native ads · scroll for more"
        >
          <DCSection id="feed" title="Feed">
            <DCArtboard id="main" label="Community feed" width={430} height={920}>
              <IOSDevice width={390} height={844}>
                <FeedScreen cfg={cfg}/>
              </IOSDevice>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel title="Tweaks">
          <TweakSection label="Post layout"/>
          <TweakSlider label="Image height" value={t.imageHeight} min={150} max={340} step={2} unit="px"
                       onChange={(v) => setTweak('imageHeight', v)}/>
          <TweakSlider label="Card corners" value={t.cardRadius} min={8} max={28} step={1} unit="px"
                       onChange={(v) => setTweak('cardRadius', v)}/>
          <TweakSlider label="Image peek" value={t.peek} min={0} max={44} step={2} unit="px"
                       onChange={(v) => setTweak('peek', v)}/>
          <TweakRadio label="Image fit" value={t.imageFit} options={['cover', 'contain']}
                      onChange={(v) => setTweak('imageFit', v)}/>
        </TweaksPanel>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
