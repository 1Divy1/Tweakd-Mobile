<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Map — Kinetic Edge</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #EDEFF3; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes ke-pulse {
    0%   { transform: scale(0.55); opacity: 0.5; }
    100% { transform: scale(2.4);  opacity: 0; }
  }
  .ke-pulse { animation: ke-pulse 2s ease-out infinite; }

  @keyframes ke-accuracy {
    0%, 100% { transform: translate(-50%,-50%) scale(1);   opacity: 0.55; }
    50%      { transform: translate(-50%,-50%) scale(1.25); opacity: 0.25; }
  }
  .ke-accuracy { animation: ke-accuracy 3s ease-in-out infinite; }

  @keyframes ke-blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }
  .ke-blink { animation: ke-blink 1.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .ke-pulse, .ke-accuracy, .ke-blink { animation: none; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="palette.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="event-data.jsx"></script>
<script type="text/babel" src="event-widget.jsx"></script>
<script type="text/babel" src="add-flow.jsx"></script>
<script type="text/babel" src="event-create.jsx"></script>
<script type="text/babel" src="map.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const { IOSDevice } = window;
  const { MapScreen } = window;

  function Frame(props) {
    return (
      <IOSDevice width={390} height={844}>
        <MapScreen {...props}/>
      </IOSDevice>
    );
  }

  function App() {
    return (
      <DesignCanvas
        title="Virtual Map — Kinetic Edge"
        subtitle="Car meets (live / upcoming / previous) + businesses · drag to pan, tap a pin"
      >
        <DCSection id="states" title="Map states">
          <DCArtboard id="browse" label="Browse — all activity" width={430} height={920}>
            <Frame initCity="monaco" initFilter="all" initSheet="peek"/>
          </DCArtboard>
          <DCArtboard id="live" label="Live meet — floating widget" width={430} height={920}>
            <Frame initCity="monaco" initFilter="all" initSelected="m1" initSheet="peek"/>
          </DCArtboard>
          <DCArtboard id="upcoming" label="Upcoming filter — entry request" width={430} height={920}>
            <Frame initCity="monaco" initFilter="upcoming" initSelected="m2" initSheet="peek"/>
          </DCArtboard>
          <DCArtboard id="previous" label="Previous filter" width={430} height={920}>
            <Frame initCity="monaco" initFilter="previous" initSheet="open"/>
          </DCArtboard>
          <DCArtboard id="biz" label="Businesses filter" width={430} height={920}>
            <Frame initCity="monaco" initFilter="business" initSheet="open"/>
          </DCArtboard>
          <DCArtboard id="far" label="Far away — another city" width={430} height={920}>
            <Frame initCity="london" initFilter="all" initSheet="peek"/>
          </DCArtboard>
        </DCSection>
        <DCSection id="create" title="Create event — organizer flow">
          <DCArtboard id="create-form" label="Create form" width={430} height={920}>
            <Frame initCity="monaco" initSheet="peek" initShowCreate={true}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
