<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Post Composer — Kinetic Edge</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="palette.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="add-flow.jsx"></script>
<script type="text/babel" src="post-flow.jsx"></script>
<script type="text/babel" src="post-flow-screens.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const { IOSDevice } = window;
  const { StepPhotos, StepCaption, StepTags, StepVisibility, StepReview,
          ManageSheet, DeleteConfirm, EditReview } = window;

  function Frame({ children }) {
    return <IOSDevice width={390} height={844}>{children}</IOSDevice>;
  }

  const createSteps = [
    { id: "p1", label: "01 · Photos",     node: <StepPhotos/> },
    { id: "p2", label: "02 · Caption",    node: <StepCaption/> },
    { id: "p3", label: "03 · Tags",       node: <StepTags/> },
    { id: "p4", label: "04 · Visibility", node: <StepVisibility/> },
    { id: "p5", label: "05 · Review",     node: <StepReview/> },
  ];

  function App() {
    return (
      <DesignCanvas
        title="Post Composer — Kinetic Edge"
        subtitle="Multi-step posting flow · photos → caption → tags → visibility → review · plus edit, manage & delete"
      >
        <DCSection id="create" title="Create a post — five focused steps">
          {createSteps.map(s => (
            <DCArtboard key={s.id} id={s.id} label={s.label} width={430} height={910}>
              <Frame>{s.node}</Frame>
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="manage" title="Manage an existing post — opens from the post's “…” menu">
          <DCArtboard id="manage" label="Post options sheet" width={430} height={910}>
            <Frame><ManageSheet/></Frame>
          </DCArtboard>
          <DCArtboard id="edit" label="Edit · review changes (with delete)" width={430} height={910}>
            <Frame><EditReview/></Frame>
          </DCArtboard>
          <DCArtboard id="delete" label="Delete confirmation" width={430} height={910}>
            <Frame><DeleteConfirm/></Frame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
