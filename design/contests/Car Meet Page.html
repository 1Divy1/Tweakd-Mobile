<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Car Meet — Kinetic Edge</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #EDEFF3; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  a { color: #FF4D00; text-decoration: none; }
  a:hover { color: #E64500; }
  @keyframes ke-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .ke-blink { animation: ke-blink 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .ke-blink { animation: none; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="palette.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="event-data.jsx"></script>
<script type="text/babel" src="event-widget.jsx"></script>
<script type="text/babel" src="car-meet.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const { IOSDevice } = window;
  const { CarMeetScreen } = window;

  function Frame(props) {
    return (
      <IOSDevice width={390} height={844}>
        <CarMeetScreen {...props} onBack={() => window.location.assign("Map Page.html")}/>
      </IOSDevice>
    );
  }

  function App() {
    return (
      <DesignCanvas
        title="Car Meet page — Kinetic Edge"
        subtitle="Event info up top, participating cars below · reached from the map widget"
      >
        <DCSection id="states" title="Event states">
          <DCArtboard id="live" label="Live meet — approved entry" width={430} height={920}>
            <Frame eventId="m1"/>
          </DCArtboard>
          <DCArtboard id="upcoming" label="Upcoming meet — can request entry" width={430} height={920}>
            <Frame eventId="m2" participation={null}/>
          </DCArtboard>
          <DCArtboard id="pending" label="Entry request pending approval" width={430} height={920}>
            <Frame eventId="m2" participation={{status:"pending", car:"Nissan Skyline R34 GT-R"}}/>
          </DCArtboard>
          <DCArtboard id="closed" label="Registration closed" width={430} height={920}>
            <Frame eventId="m2" participation={null} regClosed={true}/>
          </DCArtboard>
          <DCArtboard id="previous" label="Previous meet — recap photos" width={430} height={920}>
            <Frame eventId="m3"/>
          </DCArtboard>
        </DCSection>
        <DCSection id="cars" title="Participating cars (second tab)">
          <DCArtboard id="cars-live" label="Live meet — entry list" width={430} height={920}>
            <Frame eventId="m1" initTab="cars"/>
          </DCArtboard>
          <DCArtboard id="cars-upcoming" label="Upcoming — declined entry, retry" width={430} height={920}>
            <Frame eventId="m2" initTab="cars" participation={{status:"rejected", car:"Mazda RX-7 FD", note:"Wrong category for a JDM-only meet — bring the Skyline instead."}}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
