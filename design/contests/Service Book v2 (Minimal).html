<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Service Book v2 (Minimal) — Tweakd</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #EDEFF3; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  a { color: #FF4D00; }
  a:hover { color: #E64500; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="palette.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="servicebook-minimal.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, IOSDevice } = window;
  const { SBM_OverviewScreen, SBM_HistoryScreen, SBM_ScheduleScreen, SBM_DocumentScreen } = window;

  function Frame({ children }) {
    return <IOSDevice width={390} height={844}>{children}</IOSDevice>;
  }

  function FlowFrame() {
    const [screen, setScreen] = React.useState("overview");
    let body;
    if (screen === "schedule") body = <SBM_ScheduleScreen onClose={() => setScreen("overview")} />;
    else if (screen === "document") body = <SBM_DocumentScreen onClose={() => setScreen("overview")} />;
    else if (screen === "history") body = <SBM_HistoryScreen onBack={() => setScreen("overview")} />;
    else body = (
      <SBM_OverviewScreen
        onSchedule={() => setScreen("schedule")}
        onDocument={() => setScreen("document")}
        onHistory={() => setScreen("history")}
      />
    );
    return <Frame>{body}</Frame>;
  }

  function App() {
    return (
      <DesignCanvas
        title="Service Book v2 — Minimal"
        subtitle="Monochrome · flat rows · color only for overdue · compare with v1"
      >
        <DCSection id="flow" title="Interactive flow" subtitle="Tap Schedule / Add Document / All — back returns to the overview">
          <DCArtboard id="flow-main" label="Service Book · clickable prototype" width={430} height={904}>
            <FlowFrame />
          </DCArtboard>
        </DCSection>
        <DCSection id="screens" title="Screens">
          <DCArtboard id="overview" label="Overview" width={430} height={904}>
            <Frame><SBM_OverviewScreen /></Frame>
          </DCArtboard>
          <DCArtboard id="history" label="Service history" width={430} height={904}>
            <Frame><SBM_HistoryScreen /></Frame>
          </DCArtboard>
          <DCArtboard id="schedule" label="Schedule maintenance" width={430} height={904}>
            <Frame><SBM_ScheduleScreen /></Frame>
          </DCArtboard>
          <DCArtboard id="document" label="Add document" width={430} height={904}>
            <Frame><SBM_DocumentScreen /></Frame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
